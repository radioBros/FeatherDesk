    SlaPolicy:
      type: object
      properties:
        priority:
          $ref: "#/components/schemas/Priority"
        first_response_minutes:
          type: integer
          minimum: 1
        resolution_minutes:
          type: integer
          minimum: 1
        calendar_mode:
          $ref: "#/components/schemas/CalendarMode"
      required:
        - priority
        - first_response_minutes
        - resolution_minutes
        - calendar_mode
    AssignmentStrategy:
      type: string
      enum:
        - manual
        - round_robin
        - least_busy
      description: |-
        How unassigned tickets of a team get an owner (D-19 A). `manual` (default) leaves them unassigned;
        `round_robin` rotates over the eligible agents; `least_busy` picks the eligible agent with the fewest open tickets.
        Eligible = M-4 (active, member of the team, effective tier ≥ ticket tier) and not away. It runs on create, team
        change, escalation or de-escalation that clears the assignee, and unassign.
    Availability:
      type: object
      properties:
        away:
          type: boolean
        away_since:
          oneOf:
            - $ref: "#/components/schemas/Timestamp"
            - type: "null"
      required:
        - away
        - away_since
    AvailabilityPatch:
      type: object
      properties:
        away:
          type: boolean
      required:
        - away
      additionalProperties: false
    AutomationEvent:
      type: string
      enum:
        - ticket.created
        - message.created
        - ticket.updated
        - time
      description: |-
        What runs the rule. `message.created` fires on customer replies only. `ticket.updated` fires once per change
        (status, priority, assignee, team, tier, category, tags, custom fields, subject), never for changes made by
        automation itself (loop guard). `time` rules run on the hourly scheduler.
    AutomationMatch:
      type: string
      enum:
        - all
        - any
    AutomationConditionField:
      type: string
      enum:
        - subject
        - body
        - channel
        - priority
        - status
        - tier
        - category_id
        - team_id
        - project
        - organization_id
        - requester_domain
        - tag
        - custom_field
        - business_hours
        - hours_since_update
        - hours_since_status
    AutomationOperator:
      type: string
      enum:
        - is
        - is_not
        - contains
        - not_contains
        - regex
        - gte
        - lte
        - present
        - absent
        - equals
      description: |-
        Allowed per field: `subject`/`body` contains, not_contains, regex (RE2, ≤ 500 characters, case-insensitive);
        `channel`/`priority`/`status`/`category_id`/`team_id`/`organization_id`/`requester_domain` is, is_not (a value or a
        list); `tier` is, is_not, gte, lte; `tag` present, absent; `custom_field` equals, contains (needs `key`);
        `business_hours` is (boolean); `hours_since_update`/`hours_since_status` gte (time rules only).
    AutomationCondition:
      type: object
      properties:
        field:
          $ref: "#/components/schemas/AutomationConditionField"
        op:
          $ref: "#/components/schemas/AutomationOperator"
        key:
          type: string
          description: "Custom field key (`custom_field` only)"
        value:
          type:
            - string
            - number
            - boolean
            - array
          items:
            type: string
      required:
        - field
        - op
    AutomationActionType:
      type: string
      enum:
        - set_priority
        - set_team
        - set_category
        - set_status
        - set_tier
        - add_tag
        - remove_tag
        - assign
        - add_note
        - send_reply
        - escalate
        - add_watcher
    AutomationAction:
      type: object
      properties:
        type:
          $ref: "#/components/schemas/AutomationActionType"
        value:
          type:
            - string
            - integer
          description: "Priority, team id, category id (empty = none), status, tier or tag name"
        strategy:
          type: string
          enum:
            - round_robin
            - least_busy
          description: "`assign` with a strategy"
        user_id:
          $ref: "#/components/schemas/Id"
          description: "`assign` to a specific agent, `add_watcher`"
        body_md:
          type: string
          maxLength: 10000
          description: "`add_note` text (internal, never shown to customers)"
        canned_response_id:
          $ref: "#/components/schemas/Id"
          description: "`send_reply`: the canned response sent as a public reply"
      required:
        - type
    AutomationRule:
