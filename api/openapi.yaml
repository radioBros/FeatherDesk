# SimpleTickets API — OpenAPI 3.1. Hand-maintained; every route in the router must exist here
# (enforced by internal/apispec AssertRoutes). Enums must equal internal/domain (TestEnumsMatchOpenAPI).

openapi: "3.1.0"
info:
  title: SimpleTickets API
  version: "1.0.0"
  summary: "Self-hosted, lightweight help desk"
  description: |-
    SimpleTickets REST API (v1). One API serves the SPA and integrations.

    **Path convention.** Paths below are relative to the server URL `/api/v1` (e.g. `/auth/config` is `GET /api/v1/auth/config`).
    A few routes live at the site root and carry a path-level `servers: [{url: /}]` override: `/healthz`, `/readyz`, `/metrics`,
    `/branding/{file}`, `/kb/sitemap.xml`, `/api/docs`, `/mcp`.

    **Authentication.** Either the session cookie `st_session` (browser; cookie-authenticated `POST/PUT/PATCH/DELETE` must send
    `X-CSRF-Token` with the value from `GET /me`) or `Authorization: Bearer st_pat_…` (personal access token). Required PAT scopes are
    listed per operation in `x-scopes`; effective permission is the owner's role ∩ token scopes.

    **Errors** are RFC 9457 `application/problem+json` (`Problem`). Reads of objects outside the caller's visibility return **404**;
    actions on visible objects the caller may not perform return **403**.

    **Pagination** is cursor-based: `?limit=50&cursor=…` → `{items, next_cursor}`.

    **Realtime.** `GET /ws` upgrades to a WebSocket (subprotocol `simpletickets.v1`); see `x-websocket` on that operation and the
    `WsClientFrame`/`WsServerFrame` schemas. Mutations always go through REST.

    **Webhooks** are described in the top-level `webhooks` section. Delivery is at-least-once: deduplicate on the envelope `id`.

    `x-phase` marks the build milestone (CORE or V1); everything ships in v1.0.
  license:
    name: AGPL-3.0-only
    identifier: AGPL-3.0-only
  contact:
    name: RadioBros
    url: https://radiobros.com/
servers:
  - url: /api/v1
    description: This instance
security:
  - cookieAuth: []
  - bearerAuth: []
tags:
  - name: System
    description: "Health, metrics and this document"
  - name: Auth
    description: "Login, OIDC, registration, password reset"
  - name: Setup
    description: First-run wizard
  - name: Me
    description: "Current user, tokens, sessions, signature, notifications"
  - name: Realtime
    description: WebSocket channel
  - name: Portal
    description: "Customer portal (customers only)"
  - name: Tickets
    description: "Staff ticket work (staff only)"
  - name: Projects
    description: "Projects (D-20): keys and ticket refs, membership, team mapping, per-project SLA and portal branding"
  - name: Directory
    description: "Customers, organizations, teams, staff lookups"
  - name: Reports
    description: Reporting
  - name: Knowledge base
    description: "Public, customer and internal articles"
  - name: Inbound email
    description: "Email → ticket"
  - name: Branding
    description: Brand assets
  - name: Administration
    description: Admin and supervisor configuration
  - name: Webhooks
    description: Outbound event deliveries
  - name: Privacy
    description: "GDPR tooling: data export, erasure, retention, consent"
  - name: MCP
    description: "Model Context Protocol endpoint for AI assistants (`/mcp`)"
paths:
  /healthz:
    servers:
      - url: /
        description: "Served at the site root, outside /api/v1"
    get:
      operationId: getHealthz
      summary: Liveness probe
      tags:
        - System
      description: |-
        Returns `ok` while the process runs.

        Phase: CORE.
      security: []
      x-phase: CORE
      responses:
        "200":
          description: OK
          content:
            text/plain:
              schema:
                type: string
  /readyz:
    servers:
      - url: /
        description: "Served at the site root, outside /api/v1"
    get:
      operationId: getReadyz
      summary: Readiness probe
      tags:
        - System
      description: |-
        Checks the active DB engine and blob backend. 503 when not ready.

        Phase: CORE.
      security: []
      x-phase: CORE
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    enum:
                      - ok
                      - degraded
                  db:
                    type: boolean
                  blob:
                    type: boolean
                required:
                  - status
        "503":
          description: Not ready
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                  db:
                    type: boolean
                  blob:
                    type: boolean
  /metrics:
    servers:
      - url: /
        description: "Served at the site root, outside /api/v1"
    get:
      operationId: getMetrics
      summary: Prometheus metrics
      tags:
        - System
      description: |-
        Text exposition format. Requires `Authorization: Bearer $ST_METRICS_TOKEN`; disabled when the token is unset.

        Phase: V1.
      x-phase: V1
      responses:
        "200":
          description: OK
          content:
            text/plain:
              schema:
                type: string
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
      security:
        - metricsToken: []
  /branding/{file}:
    servers:
      - url: /
        description: "Served at the site root, outside /api/v1"
    get:
      operationId: getBrandingAsset
      summary: Brand asset
      tags:
        - Branding
      description: |-
        Immutable, content-addressed. SVG is served with `Content-Security-Policy: sandbox`.

        Phase: CORE.
      security: []
      parameters:
        - name: file
          in: path
          required: true
          schema:
            type: string
            pattern: "^[0-9a-f]{64}\\.[a-z0-9]+$"
          description: "`<sha256>.<ext>`"
      x-phase: CORE
      responses:
        "200":
          description: OK
          content:
            "image/*":
              schema:
                type: string
                contentEncoding: binary
          headers:
            Cache-Control:
              schema:
                type: string
              description: "`public, max-age=31536000, immutable`"
        "404":
          $ref: "#/components/responses/NotFound"
  /kb/sitemap.xml:
    servers:
      - url: /
        description: "Served at the site root, outside /api/v1"
    get:
      operationId: getKbSitemap
      summary: Public KB sitemap
      tags:
        - Knowledge base
      description: |-
        Public articles only; 404 unless `kb_sitemap_enabled`.

        Phase: V1.
      security: []
      x-phase: V1
      responses:
        "200":
          description: OK
          content:
            application/xml:
              schema:
                type: string
        "404":
          $ref: "#/components/responses/NotFound"
  /api/docs:
    servers:
      - url: /
        description: "Served at the site root, outside /api/v1"
    get:
      operationId: getApiDocs
      summary: API reference page
      tags:
        - System
      description: "Phase: V1."
      security: []
      x-phase: V1
      responses:
        "200":
          description: OK
          content:
            text/html:
              schema:
                type: string
  /mcp:
    servers:
      - url: /
        description: "Served at the site root, outside /api/v1"
    post:
      operationId: postMcp
      summary: MCP endpoint (Streamable HTTP)
      tags:
        - MCP
      description: |-
        Model Context Protocol server for AI clients (Claude Code, Claude Desktop, Cursor, …): one JSON-RPC 2.0 message per POST,
        answered with a single JSON body (never an SSE stream). Off unless an admin sets `integrations.mcp_enabled`
        (`PATCH /admin/integrations`); while off every `/mcp` method answers 404. Guide: `docs/features/mcp.md`.

        **Authentication.** `Authorization: Bearer st_pat_…` only; cookies are ignored. Every tool runs as the token owner, limited by
        the token's scopes (I-6), as an in-process call of the matching REST operation, so it gets exactly that operation's `x-scopes`,
        authorisation, lifecycle checks and customer-safe view (I-2, I-7, I-9). Customers' tokens get customer tools only. A request
        with an `Origin` header other than the public URL's origin (or one in `ST_ALLOWED_ORIGINS`) is refused with 403 (DNS
        rebinding). Rate limits: 20/s per client IP and 10/s (burst 40) per token owner.

        **Protocol revisions.** `2026-07-28` (stateless: `_meta.io.modelcontextprotocol/protocolVersion` and `clientCapabilities` on
        every request, mirrored in `MCP-Protocol-Version`, `Mcp-Method` and `Mcp-Name`; `server/discover`; header mismatch → 400
        `-32020`, unsupported version → 400 `-32022`, unknown method → 404 `-32601`) and the session-based `2025-11-25`, `2025-06-18`
        and `2025-03-26` (`initialize` returns `Mcp-Session-Id`, required on every later request: missing → 400, unknown or
        expired → 404; JSON-RPC batches only in a `2025-03-26` session). Methods: `initialize`, `ping`, `server/discover`,
        `tools/list`, `tools/call`, `resources/list`, `resources/templates/list`, `resources/read`.

        Tools: `search_tickets`, `list_my_tickets`, `get_ticket`, `create_ticket`, `reply_to_ticket`, `update_ticket`,
        `search_kb`, `get_kb_article`, `list_categories`, and for staff also `add_internal_note`, `escalate_ticket`,
        `deescalate_ticket`, `apply_macro`, `list_teams`. Tool failures are results with `isError: true` and the REST problem slug in
        `structuredContent.error.slug`. Resources: `ticket://{number}`, `kb://{slug}`.

        Phase: V1.
      security:
        - bearerAuth: []
      parameters:
        - name: MCP-Protocol-Version
          in: header
          required: false
          schema:
            type: string
          description: "Protocol revision of the request (required by 2025-06-18 and later after `initialize`)"
        - name: Mcp-Session-Id
          in: header
          required: false
          schema:
            type: string
          description: "Legacy session from `initialize` (2025-03-26 … 2025-11-25); ignored by 2026-07-28"
        - name: Mcp-Method
          in: header
          required: false
          schema:
            type: string
          description: "2026-07-28: mirrors the JSON-RPC `method`"
        - name: Mcp-Name
          in: header
          required: false
          schema:
            type: string
          description: "2026-07-28: mirrors `params.name` (`tools/call`) or `params.uri` (`resources/read`)"
      x-phase: V1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
                - $ref: "#/components/schemas/JsonRpcMessage"
                - type: array
                  items:
                    $ref: "#/components/schemas/JsonRpcMessage"
            examples:
              toolsCall:
                value:
                  jsonrpc: "2.0"
                  id: 1
                  method: tools/call
                  params:
                    name: get_ticket
                    arguments:
                      ticket: 1042
      responses:
        "200":
          description: "The JSON-RPC response (an array for a 2025-03-26 batch). `initialize` also sets `Mcp-Session-Id`"
          headers:
            Mcp-Session-Id:
              schema:
                type: string
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/JsonRpcResponse"
                  - type: array
                    items:
                      $ref: "#/components/schemas/JsonRpcResponse"
        "202":
          description: "Accepted: the body was a notification (or a client response); no body"
        "400":
          description: "Parse error, invalid request, missing session, protocol header mismatch (`-32020`) or unsupported protocol version (`-32022`)"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JsonRpcResponse"
        "401":
          description: "No or invalid bearer token (`unauthenticated`; `WWW-Authenticate: Bearer`). A customer's token is invalid while the customer portal is switched off"
          headers:
            WWW-Authenticate:
              schema:
                type: string
          content:
            "application/problem+json":
              schema:
                $ref: "#/components/schemas/Problem"
        "403":
          description: "`Origin` header not allowed (`forbidden`)"
          content:
            "application/problem+json":
              schema:
                $ref: "#/components/schemas/Problem"
        "404":
          description: "MCP is switched off (`not-found`), the legacy session is unknown or expired, or (2026-07-28) the method does not exist (`-32601`)"
          content:
            "application/problem+json":
              schema:
                $ref: "#/components/schemas/Problem"
            application/json:
              schema:
                $ref: "#/components/schemas/JsonRpcResponse"
        "413":
          $ref: "#/components/responses/TooLarge"
        "415":
          description: "Body is not `application/json` (`unsupported-media-type`)"
          content:
            "application/problem+json":
              schema:
                $ref: "#/components/schemas/Problem"
        "429":
          $ref: "#/components/responses/RateLimited"
    get:
      operationId: getMcp
      summary: MCP standalone stream (not offered)
      tags:
        - MCP
      description: "This server never opens a standalone SSE stream: 405 (`Allow: POST, DELETE`), or 404 while MCP is switched off. Phase: V1."
      security: []
      x-phase: V1
      responses:
        "404":
          $ref: "#/components/responses/NotFound"
        "405":
          description: "Method not allowed (`method-not-allowed`)"
          headers:
            Allow:
              schema:
                type: string
          content:
            "application/problem+json":
              schema:
                $ref: "#/components/schemas/Problem"
    delete:
      operationId: deleteMcpSession
      summary: End an MCP session
      tags:
        - MCP
      description: "Ends the legacy session named by `Mcp-Session-Id` (only the token that created it may). Without the header: 405. Phase: V1."
      security:
        - bearerAuth: []
      parameters:
        - name: Mcp-Session-Id
          in: header
          required: false
          schema:
            type: string
      x-phase: V1
      responses:
        "204":
          description: Session ended
        "401":
          description: "No or invalid bearer token (`unauthenticated`)"
          headers:
            WWW-Authenticate:
              schema:
                type: string
          content:
            "application/problem+json":
              schema:
                $ref: "#/components/schemas/Problem"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "405":
          description: "No session header (`method-not-allowed`)"
          headers:
            Allow:
              schema:
                type: string
          content:
            "application/problem+json":
              schema:
                $ref: "#/components/schemas/Problem"
        "429":
          $ref: "#/components/responses/RateLimited"
  /openapi.yaml:
    get:
      operationId: getOpenApi
      summary: This OpenAPI document
      tags:
        - System
      description: "Phase: V1."
      security: []
      x-phase: V1
      responses:
        "200":
          description: OK
          content:
            application/yaml:
              schema:
                type: string
  /auth/config:
    get:
      operationId: getAuthConfig
      summary: Public login and instance configuration
      tags:
        - Auth
      description: |-
        Login methods per audience, branding, tier labels, upload limits, `email_enabled`, `setup_pending`.

        Phase: CORE.
      security: []
      parameters:
        - name: project
          in: query
          schema:
            type: string
            maxLength: 36
          description: "D-20: a project key (the `/p/{key}` portal entry); adds `project` to the response"
      x-phase: CORE
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthConfig"
  /auth/login:
    post:
      operationId: login
      summary: Local login
      tags:
        - Auth
      description: |-
        Sets the `st_session` cookie. Failures are constant-time and generic. With audience `customer` it answers 404 `portal-disabled` while `support.portal_enabled` is off. Staff local login only works for break-glass admins unless `ST_AUTH_STAFF_LOCAL=true`.

        With two-factor authentication (D-19 §B) a correct password answers `MfaChallenge` instead and sets no cookie: continue with
        `POST /auth/mfa/verify` (or `/auth/mfa/enroll/*` when the `security.mfa_required` policy forces enrolment). The same applies to
        verify-email, magic-link and invite-accept. OIDC logins and personal access tokens are never challenged.

        Phase: CORE.
      security: []
      x-phase: CORE
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/Me"
                  - $ref: "#/components/schemas/MfaChallenge"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "429":
          $ref: "#/components/responses/RateLimited"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/Validation"
      x-sets-cookie: st_session
  /auth/mfa/verify:
    post:
      operationId: mfaVerify
      summary: Complete a login with a second factor
      tags:
        - Auth
      description: |-
        Second step of a login that answered `MfaChallenge` (D-19 §B). `method` is one of the challenge's `methods`. Success sets the
        `st_session` cookie and returns `Me`. A wrong code is a 422 on `code` while attempts remain (5 per challenge, each one also counts
        toward the login throttle); an unknown, used, expired or exhausted challenge is a 401 and the user signs in again. TOTP codes are
        accepted within ±1 step and never twice; recovery codes are single use.

        Phase: V1.
      security: []
      x-phase: V1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MfaVerifyRequest"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Me"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          $ref: "#/components/responses/Validation"
        "429":
          $ref: "#/components/responses/RateLimited"
      x-sets-cookie: st_session
  /auth/mfa/email/send:
    post:
      operationId: mfaSendEmailCode
      summary: E-mail a one-time sign-in code
      tags:
        - Auth
      description: |-
        Mails a 6-digit code (valid 10 minutes, single use) for a login challenge whose user enabled e-mail codes, or for a forced enrolment.
        At most 3 sends per challenge, 30 s apart. **409 `email-disabled`** when SMTP is not configured; 409 `conflict` when the account has
        no e-mail method.

        Phase: V1.
      security: []
      x-phase: V1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MfaTokenRequest"
      responses:
        "200":
          description: Sent
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Accepted"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/Validation"
        "429":
          $ref: "#/components/responses/RateLimited"
  /auth/mfa/enroll/totp:
    post:
      operationId: mfaEnrollTotp
      summary: TOTP secret for a forced enrolment
      tags:
        - Auth
      description: |-
        Only for a challenge with `enrollment_required: true` (the `security.mfa_required` policy covers the user and they have no second
        factor yet). Returns a new secret and its `otpauth://` URI; each call replaces the previous one. No session exists yet.

        Phase: V1.
      security: []
      x-phase: V1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MfaTokenRequest"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MfaTotpSetup"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          $ref: "#/components/responses/Validation"
        "429":
          $ref: "#/components/responses/RateLimited"
  /auth/mfa/enroll/confirm:
    post:
      operationId: mfaEnrollConfirm
      summary: Finish a forced enrolment
      tags:
        - Auth
      description: |-
        Confirms the TOTP secret from `/auth/mfa/enroll/totp` or an e-mailed code, enables that method, issues the 10 recovery codes (shown
        only in this response) and starts the session.

        Phase: V1.
      security: []
      x-phase: V1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MfaEnrollConfirmRequest"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MfaEnrollLoginResult"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          $ref: "#/components/responses/Validation"
        "429":
          $ref: "#/components/responses/RateLimited"
      x-sets-cookie: st_session
  /auth/logout:
    post:
      operationId: logout
      summary: Logout
      tags:
        - Auth
      description: |-
        Revokes the session. `redirect_url` is the IdP end-session URL for OIDC sessions (RP-initiated logout).

        Phase: CORE.
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
      x-phase: CORE
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LogoutResult"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
  /auth/oidc/{audience}/start:
    get:
      operationId: oidcStart
      summary: Start OIDC login
      tags:
        - Auth
      description: |-
        Staff audience in CORE, customer audience in V1. 404 when that audience has no OIDC client configured, or (customer audience) 404 `portal-disabled` while the customer portal is switched off.

        Phase: CORE.
      security: []
      parameters:
        - name: audience
          in: path
          required: true
          schema:
            $ref: "#/components/schemas/Audience"
        - name: redirect
          in: query
          schema:
            type: string
          description: Same-origin path to return to after login
      x-phase: CORE
      responses:
        "302":
          description: "Redirect to the IdP (state, nonce, PKCE)"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          $ref: "#/components/responses/Unavailable"
  /auth/oidc/{audience}/callback:
    get:
      operationId: oidcCallback
      summary: OIDC callback
      tags:
        - Auth
      description: |-
        Verifies the ID token, syncs staff role/tier from groups on every login (D-04 §4). No mapped group → 403 and the user is disabled.

        The customer audience answers 404 `portal-disabled` while the customer portal is switched off.

        A refused **browser** navigation (`Accept: text/html`) in the staff audience is redirected (302) to `/agent/login?error=<code>` instead, with `code` one of `no_role`, `disabled`, `oidc_failed`, `idp_unavailable`, so the login page can explain it.

        Phase: CORE.
      security: []
      parameters:
        - name: audience
          in: path
          required: true
          schema:
            $ref: "#/components/schemas/Audience"
        - name: code
          in: query
          schema:
            type: string
        - name: state
          in: query
          schema:
            type: string
      x-phase: CORE
      responses:
        "302":
          description: "Redirect into the area with the session cookie set; or, for a refused staff browser login, to `/agent/login?error=<code>`"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          $ref: "#/components/responses/Unavailable"
  /auth/oidc/{audience}/backchannel-logout:
    post:
      operationId: oidcBackchannelLogout
      summary: OIDC back-channel logout
      tags:
        - Auth
      description: |-
        OpenID Back-Channel Logout 1.0 (AUTH-030).

        Phase: V1.
      security: []
      parameters:
        - name: audience
          in: path
          required: true
          schema:
            $ref: "#/components/schemas/Audience"
      x-phase: V1
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                logout_token:
                  type: string
              required:
