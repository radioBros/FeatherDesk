                  name:
                    type: string
                  state:
                    type: string
          required:
            - type
            - topic
            - users
      description: "Server → client frame. Close codes: 4401 unauthenticated/revoked, 4403 forbidden, 4008 slow consumer, 4029 rate limited, 1001 server shutdown."
