    MfaMethod:
      type: string
      enum:
        - totp
        - email
        - recovery
      description: "Second factors (D-19 §B). `recovery` is a single-use recovery code."
    MfaPolicy:
      type: string
      enum:
        - none
        - staff
        - all
      description: "`security.mfa_required`: nobody, every local staff account, or every local account."
    MfaChallenge:
      type: object
      additionalProperties: false
      description: |-
        Answer of a successful first factor (password, magic link, verification or invitation link) when the user has a second factor or
        the policy forces enrolment. No session exists yet. Continue with `/auth/mfa/verify` or, when `enrollment_required`,
        `/auth/mfa/enroll/*`. The challenge lasts 5 minutes (10 after an e-mail code was sent) and allows 5 wrong codes.
      properties:
        mfa_required:
          type: boolean
          const: true
        mfa_token:
          type: string
          description: "Opaque, single use; only its sha256 is stored"
        methods:
          type: array
          items:
            $ref: "#/components/schemas/MfaMethod"
        enrollment_required:
          type: boolean
        expires_at:
          $ref: "#/components/schemas/Timestamp"
      required:
        - mfa_required
        - mfa_token
        - methods
        - enrollment_required
        - expires_at
    MfaTokenRequest:
      type: object
      properties:
        mfa_token:
          type: string
          minLength: 1
          maxLength: 128
      required:
        - mfa_token
    MfaVerifyRequest:
      type: object
      properties:
        mfa_token:
          type: string
          minLength: 1
          maxLength: 128
        method:
          $ref: "#/components/schemas/MfaMethod"
        code:
          type: string
          minLength: 1
          maxLength: 64
      required:
        - mfa_token
        - method
        - code
    MfaEnrollConfirmRequest:
      type: object
      properties:
        mfa_token:
          type: string
          minLength: 1
          maxLength: 128
        method:
          type: string
          enum:
            - totp
            - email
        code:
          type: string
          minLength: 1
          maxLength: 64
      required:
        - mfa_token
        - method
        - code
    MfaCodeRequest:
      type: object
      properties:
        code:
          type: string
          minLength: 1
          maxLength: 64
      required:
        - code
    ReauthRequest:
      type: object
      properties:
        password:
          type: string
          minLength: 1
          maxLength: 1024
      required:
        - password
    MfaTotpSetup:
      type: object
      additionalProperties: false
      description: "Shown once, for the authenticator app (RFC 6238: SHA1, 30 s, 6 digits)."
      properties:
        secret:
          type: string
          description: "Base32, no padding"
        otpauth_uri:
          type: string
          description: "`otpauth://totp/<issuer>:<email>?secret=…` (render as a QR code)"
      required:
        - secret
        - otpauth_uri
    MfaStatus:
      type: object
      additionalProperties: false
      properties:
        available:
          type: boolean
          description: "False for SSO-managed accounts and accounts without a local password"
        enabled:
          type: boolean
        required:
          type: boolean
          description: "The instance policy requires a second factor for this account"
        totp_enabled:
          type: boolean
        totp_enabled_at:
          oneOf:
            - $ref: "#/components/schemas/Timestamp"
            - type: "null"
        email_enabled:
          type: boolean
        email_available:
          type: boolean
          description: "SMTP is configured (e-mail codes can be sent)"
        recovery_codes_remaining:
          type: integer
          minimum: 0
        reauth_expires_at:
          oneOf:
            - $ref: "#/components/schemas/Timestamp"
            - type: "null"
          description: "Until when MFA changes are allowed on this session without confirming the password again"
      required:
        - available
        - enabled
        - required
        - totp_enabled
        - totp_enabled_at
        - email_enabled
        - email_available
        - recovery_codes_remaining
        - reauth_expires_at
