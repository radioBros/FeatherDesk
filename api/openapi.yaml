        Irreversible. `anonymize`: the name becomes "Deleted user #n", the email `erased+<id>@invalid`; identities, sessions, tokens, MFA, notifications, the signature and preferences are removed and the user is disabled. `anonymize_and_redact` also replaces the bodies of messages the user wrote with `[redacted]`, deletes the user's attachments (rows and files) and the custom-field values and CSAT comments of tickets they requested, and refreshes the search index. Tickets stay (business records). Pending erasure requests of the user are completed. 409 for the caller themselves, a break-glass admin, or the last active admin.

        Phase: V1.
      parameters:
        - $ref: "#/components/parameters/Id"
        - $ref: "#/components/parameters/CsrfToken"
      x-scopes:
        - admin
      x-phase: V1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EraseUser"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErasureResult"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/Validation"
  /admin/privacy/settings:
    get:
      operationId: getPrivacySettings
      summary: Privacy and retention settings
      tags:
        - Privacy
      description: "Phase: V1."
      x-scopes:
        - admin
      x-phase: V1
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PrivacySettings"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    put:
      operationId: updatePrivacySettings
      summary: Update privacy and retention settings
      tags:
        - Privacy
      description: "Replaces the settings; the daily retention job uses them from its next run. Phase: V1."
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
      x-scopes:
        - admin
      x-phase: V1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PrivacySettings"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PrivacySettings"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/Validation"
  /admin/privacy/retention/preview:
    get:
      operationId: previewRetention
      summary: Retention dry run
      tags:
        - Privacy
      description: "Counts what the daily retention job would remove or anonymize right now, without changing anything. Without parameters it uses the saved policy; any parameter overrides that field (so an unsaved form can be previewed). The counts equal what the next run processes. Phase: V1."
      parameters:
        - name: closed_tickets_months
          in: query
          schema:
            type: integer
            minimum: 0
            maximum: 240
        - name: closed_tickets_action
          in: query
          schema:
            $ref: "#/components/schemas/RetentionTicketAction"
        - name: inbound_email_days
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 90
        - name: audit_log_months
          in: query
          schema:
            type: integer
            minimum: 0
            maximum: 120
        - name: export_days
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 30
      x-scopes:
        - admin
      x-phase: V1
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RetentionPreview"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/Validation"
webhooks:
  ticket.created:
    post:
      operationId: webhook_ticket_created
      summary: "`ticket.created` event"
      tags:
        - Webhooks
      parameters:
        - name: X-SimpleTickets-Event
          in: header
          required: true
          schema:
            type: string
            const: ticket.created
        - name: X-SimpleTickets-Delivery
          in: header
          required: true
          schema:
            type: string
        - name: X-SimpleTickets-Signature
          in: header
          required: true
          schema:
            type: string
            pattern: "^t=\\d+,v1=[0-9a-f]{64}$"
          description: "`t=<unix seconds>,v1=<hex hmac-sha256(secret, t + \".\" + raw_body)>`"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WebhookEnvelope"
      responses:
        "2XX":
          description: Delivered
