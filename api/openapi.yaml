          description: "Gone — the webhook is disabled immediately"
        default:
          description: "Retried with backoff (8 attempts, 30 s → 6 h); 20 consecutive failures disable the webhook"
  ticket.unlinked:
    post:
      operationId: webhook_ticket_unlinked
      summary: "`ticket.unlinked` event"
      tags:
        - Webhooks
      parameters:
        - name: X-SimpleTickets-Event
          in: header
          required: true
          schema:
            type: string
            const: ticket.unlinked
        - name: X-SimpleTickets-Delivery
          in: header
          required: true
          schema:
            type: string
        - name: X-SimpleTickets-Signature
          in: header
          required: true
          schema:
            type: string
            pattern: "^t=\\d+,v1=[0-9a-f]{64}$"
          description: "`t=<unix seconds>,v1=<hex hmac-sha256(secret, t + \".\" + raw_body)>`"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WebhookEnvelope"
      responses:
        "2XX":
          description: Delivered
        "410":
          description: "Gone — the webhook is disabled immediately"
        default:
          description: "Retried with backoff (8 attempts, 30 s → 6 h); 20 consecutive failures disable the webhook"
  ticket.children_resolved:
    post:
      operationId: webhook_ticket_children_resolved
      summary: "`ticket.children_resolved` event"
      tags:
        - Webhooks
      parameters:
        - name: X-SimpleTickets-Event
          in: header
          required: true
          schema:
            type: string
            const: ticket.children_resolved
        - name: X-SimpleTickets-Delivery
          in: header
          required: true
          schema:
            type: string
        - name: X-SimpleTickets-Signature
          in: header
          required: true
          schema:
            type: string
            pattern: "^t=\\d+,v1=[0-9a-f]{64}$"
          description: "`t=<unix seconds>,v1=<hex hmac-sha256(secret, t + \".\" + raw_body)>`"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WebhookEnvelope"
      responses:
        "2XX":
          description: Delivered
        "410":
          description: "Gone — the webhook is disabled immediately"
        default:
          description: "Retried with backoff (8 attempts, 30 s → 6 h); 20 consecutive failures disable the webhook"
components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: st_session
      description: "Session cookie (HttpOnly, Secure, SameSite=Lax). Mutations also need `X-CSRF-Token`."
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: "st_pat_…"
      description: Personal access token
    metricsToken:
      type: http
      scheme: bearer
      description: "`ST_METRICS_TOKEN`"
  parameters:
    Id:
      name: id
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/Id"
    UserIdPath:
      name: user_id
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/Id"
    ProjectFilter:
      name: project
      in: query
      schema:
        type: string
        maxLength: 36
      description: "D-20: limit to one project, by id or key (case-insensitive). An unknown project is a 422 on `project`."
    TicketRefPath:
      name: ref
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/TicketRefCode"
    Cursor:
      name: cursor
      in: query
      schema:
        type: string
      description: "Opaque cursor from `next_cursor`"
    Limit:
      name: limit
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 200
        default: 50
    Q:
      name: q
      in: query
      schema:
        type: string
        maxLength: 200
      description: Full-text search
    LocaleQ:
      name: locale
      in: query
      schema:
        $ref: "#/components/schemas/Locale"
    IfMatch:
      name: If-Match
      in: header
      schema:
        type: string
      description: "ETag of the ticket (`updated_at`); 412 on conflict"
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      schema:
        type: string
        maxLength: 200
      description: "Replays within 24 h return the original response; a different body with the same key → 422 `idempotency-mismatch`"
    CsrfToken:
      name: X-CSRF-Token
      in: header
      schema:
        type: string
      description: "Required for cookie-authenticated mutations (value from `GET /me`). Not needed with a bearer token."
  responses:
    BadRequest:
      description: Malformed request
      content:
        "application/problem+json":
          schema:
            $ref: "#/components/schemas/Problem"
    Unauthenticated:
      description: "Not authenticated (`unauthenticated`)"
      content:
        "application/problem+json":
          schema:
            $ref: "#/components/schemas/Problem"
    Forbidden:
      description: "Visible but not allowed (`forbidden`, `csrf`): missing role for the route group, PAT without the operation's `x-scopes`, or a cookie mutation without a valid CSRF token"
      content:
        "application/problem+json":
          schema:
            $ref: "#/components/schemas/Problem"
    NotFound:
      description: "Not found or not visible to the caller (`not-found`; I-1, I-3, I-4). Portal routes answer 404 to staff and agent/admin routes answer 404 to customers. `portal-disabled`: the customer portal is switched off (`support.portal_enabled=false`), so customer sign-in endpoints and the `/portal/*` group answer 404 to customers (a customer personal access token gets 404 there and 401 elsewhere)"
      content:
        "application/problem+json":
          schema:
            $ref: "#/components/schemas/Problem"
    Conflict:
      description: "Conflict (`conflict`, `invalid-transition`, `merge-cross-requester`, `link-cycle`, `email-disabled`, `setup-required`, `idempotency-in-flight`: a request with the same `Idempotency-Key` is still running)"
      content:
        "application/problem+json":
          schema:
            $ref: "#/components/schemas/Problem"
    Validation:
      description: "Validation failed (`validation`, `field-required`, `idempotency-mismatch`)"
      content:
        "application/problem+json":
          schema:
            $ref: "#/components/schemas/Problem"
    RateLimited:
      description: "Too many requests (`rate-limited`)"
      headers:
        Retry-After:
          schema:
            type: integer
      content:
        "application/problem+json":
          schema:
            $ref: "#/components/schemas/Problem"
    TooLarge:
      description: "Payload too large (`payload-too-large`)"
      content:
        "application/problem+json":
          schema:
            $ref: "#/components/schemas/Problem"
    Unavailable:
      description: "A dependency is temporarily unavailable (`unavailable`): identity provider down, blob storage not configured, or the server is shutting down"
      headers:
        Retry-After:
          schema:
            type: integer
      content:
        "application/problem+json":
          schema:
            $ref: "#/components/schemas/Problem"
    PreconditionFailed:
      description: "`If-Match` did not match (`precondition-failed`)"
      content:
        "application/problem+json":
          schema:
            $ref: "#/components/schemas/Problem"
  schemas:
    Id:
      type: string
      description: UUIDv7
      format: uuid
      examples:
        - "0192f3c4-5b6a-7c8d-9e0f-1a2b3c4d5e6f"
    Timestamp:
      type: string
      description: RFC 3339 UTC timestamp
      format: date-time
      examples:
        - "2026-10-20T10:00:00Z"
    UserKind:
      type: string
      enum:
        - staff
        - customer
      description: "Hard principal split (D-04). Never changes after creation."
    StaffRole:
      type: string
      enum:
        - admin
        - supervisor
        - agent
    CustomerRole:
      type: string
      enum:
        - requester
        - org_manager
    Role:
      type: string
      enum:
        - admin
        - supervisor
        - agent
        - requester
        - org_manager
    UserStatus:
      type: string
      enum:
        - active
        - pending_verification
        - disabled
    TicketStatus:
      type: string
      enum:
        - new
        - open
        - pending
        - on_hold
        - resolved
        - closed
    CustomerStatus:
      type: string
      enum:
        - open
        - awaiting_reply
        - resolved
        - closed
      description: "Customer-facing status. `new`/`open`/`on_hold` → `open`, `pending` → `awaiting_reply` (ticket lifecycle §1)."
    Priority:
      type: string
      enum:
        - low
        - normal
        - high
        - urgent
    Channel:
      type: string
      enum:
        - portal
        - agent
        - api
        - email
    MessageKind:
      type: string
      enum:
        - public
        - internal
        - system
    Audience:
      type: string
      enum:
        - staff
        - customer
    LinkType:
      type: string
      enum:
        - parent_of
        - related_to
        - duplicate_of
    FieldType:
      type: string
      enum:
        - text
        - textarea
        - number
        - date
        - select
        - multiselect
        - checkbox
    KbVisibility:
      type: string
      enum:
        - public
        - customers
        - internal
    KbStatus:
      type: string
      enum:
        - draft
        - published
        - archived
    Locale:
      type: string
      enum:
        - en
        - it
        - de
        - fr
        - es
    Scope:
      type: string
      enum:
        - "tickets:read"
        - "tickets:write"
        - "directory:read"
        - "directory:write"
        - "kb:read"
        - "kb:write"
        - admin
      description: "PAT scopes. Effective permission = owner's role ∩ token scopes (I-6). `tickets:read` implies `kb:read`."
    AllowedAction:
      type: string
      enum:
        - reply
        - note
        - set_status
        - set_priority
        - set_category
        - assign
        - unassign
        - transfer
        - escalate
        - deescalate
        - link
        - merge
        - split
        - edit_fields
        - edit_subject
        - watch
        - close
        - reopen
        - delete
        - resolve
        - csat
      description: "Actions the caller may perform on the ticket right now, computed server-side by `authz.Can` (permissions §6). The UI shows a control if and only if its action is listed."
    EventType:
      type: string
      description: "Event types a webhook can subscribe to. The ticket timeline (`Event.type`) uses `TimelineEventType`, a superset."
      enum:
        - ticket.created
        - ticket.status_changed
        - ticket.priority_changed
        - ticket.assigned
        - ticket.team_changed
        - ticket.escalated
        - ticket.deescalated
        - ticket.category_changed
        - ticket.tags_changed
        - ticket.fields_changed
        - message.created
        - note.created
        - sla.warning
        - sla.breached
        - ticket.csat
        - ticket.followup_created
        - ticket.merged
        - ticket.split
        - ticket.linked
        - ticket.unlinked
        - ticket.children_resolved
        - ticket.project_changed
    TimelineEventType:
      type: string
      enum:
        - ticket.created
        - ticket.status_changed
        - ticket.priority_changed
        - ticket.assigned
        - ticket.team_changed
        - ticket.escalated
        - ticket.deescalated
        - ticket.category_changed
        - ticket.tags_changed
        - ticket.fields_changed
        - message.created
        - note.created
        - sla.warning
        - sla.breached
        - ticket.csat
        - ticket.followup_created
        - ticket.merged
        - ticket.split
        - ticket.linked
        - ticket.unlinked
        - ticket.children_resolved
        - ticket.subject_changed
        - message.edited
        - ticket.watchers_changed
        - ticket.automation_applied
        - ticket.project_changed
      description: "Every stored event type that `GET /agent/tickets/{id}/events` returns: `EventType` plus edits of the subject, message edits, watcher changes, `ticket.project_changed` and `ticket.automation_applied` (a rule applied; actor id `automation`, data `AutomationApplied`)."
    ProblemSlug:
      type: string
      enum:
        - validation
        - not-found
        - forbidden
        - invalid-transition
        - conflict
        - rate-limited
        - csrf
        - unauthenticated
        - idempotency-mismatch
        - setup-required
        - email-disabled
        - merge-cross-requester
        - link-cycle
        - field-required
        - payload-too-large
        - unsupported-media-type
        - precondition-failed
        - internal
        - unavailable
        - idempotency-in-flight
        - bad-request
        - method-not-allowed
        - portal-disabled
      description: "Stable problem identifiers. `Problem.type` is `https://simpletickets.dev/problems/<slug>`."
    DeferredJobStatus:
      type: string
      enum:
        - retrying
        - dead
    NotifyMode:
      type: string
      enum:
        - agents
        - mailbox
        - both
    SmtpSecurity:
      type: string
      enum:
        - none
        - starttls
        - tls
    SmtpAuth:
      type: string
      enum:
        - none
        - plain
        - login
        - cram-md5
    BrandingSlot:
      type: string
      enum:
        - logo_light
        - logo_dark
        - icon
        - favicon
        - email_logo
        - login_background
    InboundStatus:
      type: string
      enum:
        - processed
        - quarantined
        - failed
        - ignored
    CalendarMode:
      type: string
      enum:
        - "24x7"
        - team
    TicketSort:
      type: string
      enum:
        - attention
        - updated_at
        - "-updated_at"
        - created_at
        - "-created_at"
        - priority
        - "-priority"
        - due
        - number
        - "-number"
    Tier:
      type: integer
      minimum: 1
      maximum: 3
      description: "Support tier L1–L3 (D-05)."
    LocalizedText:
      type: object
      properties: {}
      additionalProperties:
        type: string
      description: "Map of locale → text, e.g. `{\"en\": \"Billing\", \"it\": \"Fatturazione\"}`."
      propertyNames:
        $ref: "#/components/schemas/Locale"
    FieldErrorCode:
      type: string
      enum:
        - admin_only
        - boolean
        - color
        - contrast
        - customer
        - date
        - date_time
        - default_missing
        - domain
        - email
        - enum
        - file_type
        - filter
        - immutable
        - inactive
        - insecure_scheme
        - invalid
        - invalid_image
        - invalid_json
        - invalid_svg
        - invalid_url
        - kb_translation_required
        - kb_visibility_wider
        - length
        - locale
        - locked_by_env
        - max_depth
        - max_items
        - max_length
        - mention_not_visible
        - min_properties
        - not_allowed
        - not_applicable
        - not_customer
        - not_found
        - not_optional
        - not_owner
        - number
        - option
        - order
        - org_required
        - other_org
        - overlap
        - password_too_common
        - password_too_long
        - password_too_short
        - past
        - pattern
        - private_address
        - range
        - read_only
        - required
        - requires_visible
        - self
        - slug
        - staff
        - svg_not_allowed
        - team
        - tier
        - time
        - timezone
        - too_many_tokens
        - type
        - unique
        - unknown
        - unknown_team
        - unresolvable
        - unsupported_type
        - url
        - uuid
        - webmail
        - wrong_project
      description: |-
        Machine-readable reason of a field error. The SPA maps known codes to localised messages (`validations.fromServer`)
        and falls back to `invalid`. Notable codes: `required`, `length`/`max_length`, `enum`, `range`, `email`, `unique`
        (already taken), `not_found` (unknown reference), `read_only`/`unknown` (custom fields a caller may not edit or see,
        I-9), `not_optional` (notification opt-out that cannot be disabled), `locked_by_env` (set by an `ST_*` variable),
        `password_too_short`/`password_too_long`/`password_too_common`, and the webhook URL guard codes `invalid_url`,
        `insecure_scheme`, `private_address`, `unresolvable`. `TestFieldErrorCodesDocumented` keeps this list equal to the codes
        the server can emit.
    FieldError:
      type: object
      properties:
        field:
          type: string
          description: "JSON path of the field, e.g. `subject` or `custom_fields.order_id`"
        code:
          $ref: "#/components/schemas/FieldErrorCode"
        message:
          type: string
          description: "Human-readable, localised"
      required:
        - field
        - code
    Problem:
      type: object
      properties:
        type:
          type: string
          description: "`https://simpletickets.dev/problems/<slug>` — see `ProblemSlug`"
          format: uri
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        instance:
          type: string
        errors:
          type: array
          items:
            $ref: "#/components/schemas/FieldError"
          description: "Present for `validation` (422)"
        allowed:
          type: array
          items:
            $ref: "#/components/schemas/TicketStatus"
          description: "Present for `invalid-transition` (409): allowed target statuses"
      required:
        - type
        - title
        - status
      description: "RFC 9457 problem details (`application/problem+json`)."
    UserRef:
      type: object
      properties:
        id:
          $ref: "#/components/schemas/Id"
        name:
          type: string
        kind:
          $ref: "#/components/schemas/UserKind"
        avatar_url:
          type:
            - string
            - "null"
          format: uri
      required:
        - id
        - name
        - kind
      description: Minimal user reference safe for any audience.
    User:
      type: object
      properties:
        id:
          $ref: "#/components/schemas/Id"
        kind:
          $ref: "#/components/schemas/UserKind"
        email:
          type: string
          format: email
        name:
          type: string
        role:
          $ref: "#/components/schemas/Role"
        tier:
          oneOf:
            - $ref: "#/components/schemas/Tier"
            - type: "null"
        organization_id:
          oneOf:
            - $ref: "#/components/schemas/Id"
            - type: "null"
        status:
          $ref: "#/components/schemas/UserStatus"
        locale:
          $ref: "#/components/schemas/Locale"
        idp_managed:
          type: boolean
        break_glass:
          type: boolean
        has_password:
          type: boolean
        team_ids:
          type: array
          items:
            $ref: "#/components/schemas/Id"
        last_login_at:
          oneOf:
            - $ref: "#/components/schemas/Timestamp"
            - type: "null"
        created_at:
          $ref: "#/components/schemas/Timestamp"
        updated_at:
          $ref: "#/components/schemas/Timestamp"
        projects:
          type: array
          items:
            $ref: "#/components/schemas/ProjectMembership"
          description: "Staff only: project memberships (D-20). Admins and supervisors see every project regardless."
        current_project_id:
          oneOf:
            - $ref: "#/components/schemas/Id"
            - type: "null"
          description: "Staff only: the agent panel's project switcher (null = all projects)"
      required:
        - id
        - kind
        - email
        - name
        - role
        - status
        - locale
        - created_at
        - updated_at
    StaffRef:
      type: object
      properties:
        id:
          $ref: "#/components/schemas/Id"
        name:
          type: string
        email:
          type: string
          format: email
        role:
          $ref: "#/components/schemas/StaffRole"
        tier:
          $ref: "#/components/schemas/Tier"
        team_ids:
          type: array
          items:
            $ref: "#/components/schemas/Id"
      required:
        - id
        - name
        - role
        - tier
    Me:
      allOf:
        - $ref: "#/components/schemas/User"
        - type: object
          properties:
            csrf_token:
              type: string
              description: "Send as `X-CSRF-Token` on cookie-authenticated mutations"
            effective_tier:
              type: integer
            audience:
              $ref: "#/components/schemas/Audience"
            scopes:
              type:
                - array
                - "null"
              items:
                $ref: "#/components/schemas/Scope"
              description: "PAT scopes when authenticated by token; null for sessions"
            notification_opt_out:
              type: array
              items:
                type: string
              description: "Template keys the user opted out of (V1)"
            notification_prefs:
              $ref: "#/components/schemas/NotificationPrefs"
            organization:
              oneOf:
                - $ref: "#/components/schemas/Organization"
                - type: "null"
          required:
            - csrf_token
            - effective_tier
            - audience
    Organization:
      type: object
      properties:
        id:
          $ref: "#/components/schemas/Id"
        name:
          type: string
        email_domains:
          type: array
          items:
            type: string
        status:
          type: string
          enum:
            - active
            - archived
        notes:
          type: string
        member_count:
          type: integer
        created_at:
          $ref: "#/components/schemas/Timestamp"
        updated_at:
          $ref: "#/components/schemas/Timestamp"
        project_ids:
          type: array
          items:
            $ref: "#/components/schemas/Id"
          description: "Projects the organization may open tickets in (D-20). Empty = every portal-visible project. Its members still see all their own tickets."
      required:
        - id
        - name
        - status
        - created_at
        - updated_at
    Team:
      type: object
      properties:
        id:
          $ref: "#/components/schemas/Id"
        name:
          type: string
        description:
          type: string
        notification_email:
          type:
            - string
            - "null"
          format: email
        notify_mode:
          $ref: "#/components/schemas/NotifyMode"
        calendar_id:
          oneOf:
            - $ref: "#/components/schemas/Id"
            - type: "null"
        assignment_strategy:
          $ref: "#/components/schemas/AssignmentStrategy"
        member_count:
          type: integer
        created_at:
          $ref: "#/components/schemas/Timestamp"
        updated_at:
          $ref: "#/components/schemas/Timestamp"
        project_ids:
          type: array
          items:
            $ref: "#/components/schemas/Id"
          description: "Projects the team serves (D-20)"
      required:
        - id
        - name
        - notify_mode
        - created_at
        - updated_at
    TeamMember:
      type: object
      properties:
        user_id:
          $ref: "#/components/schemas/Id"
        name:
          type: string
        role:
          $ref: "#/components/schemas/StaffRole"
        tier:
          $ref: "#/components/schemas/Tier"
        source:
          type: string
          enum:
            - local
            - idp
          description: "`idp` memberships come from AUTH-031 and are read-only"
      required:
        - user_id
        - name
        - role
        - tier
        - source
    Category:
      type: object
      properties:
        id:
          $ref: "#/components/schemas/Id"
        name:
          type: string
        default_team_id:
          oneOf:
            - $ref: "#/components/schemas/Id"
            - type: "null"
        default_priority:
          oneOf:
            - $ref: "#/components/schemas/Priority"
            - type: "null"
        active:
          type: boolean
        sort:
          type: integer
        project_id:
          $ref: "#/components/schemas/Id"
      required:
        - id
        - name
        - active
        - sort
        - project_id
    ProjectKey:
      type: string
      pattern: "^[A-Z][A-Z0-9]{1,9}$"
      description: "2–10 characters: an upper-case letter, then upper-case letters or digits. Immutable once the project has tickets."
    TicketRefCode:
      type: string
      pattern: "^[A-Za-z][A-Za-z0-9]{1,9}-[1-9][0-9]{0,11}$"
      description: "A ticket reference `KEY-123` (D-20): the project key and the per-project sequence. The key is matched case-insensitively."
      examples:
        - HD-1042
    ProjectRole:
      type: string
      enum:
        - member
        - project_admin
      description: "A staff user's role in one project. `project_admin` manages that project's categories, team mapping, SLA, KB categories, automation rules, macros, canned responses and portal settings."
    ProjectRef:
      type: object
      properties:
        id:
          $ref: "#/components/schemas/Id"
        key:
          $ref: "#/components/schemas/ProjectKey"
        name:
          type: string
        color:
          type: string
          description: "`#RRGGBB` or empty"
      required:
        - id
        - key
        - name
        - color
