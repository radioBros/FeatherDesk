      description: "Client → server frame (≤ 4 KB, ≤ 20/s burst 40). Topics: `tickets`, `ticket:<id>`, `counts` (staff), `me`, `queue:<team_id>` (staff), `project:<project_id>` (staff working in the project, D-20), `kb` (staff), `admin:system` (admin)."
    WsServerFrame:
      oneOf:
        - type: object
          properties:
            type:
              const: ack
            id:
              type: string
            ok:
              type: boolean
            denied:
              type: array
              items:
                type: string
          required:
            - type
            - ok
        - type: object
          properties:
            type:
              const: event
            topic:
              type: string
            event_id:
              type: string
            event:
              type: string
            at:
              $ref: "#/components/schemas/Timestamp"
            data:
              type: object
              properties:
                ticket:
                  anyOf:
                    - $ref: "#/components/schemas/TicketSummary"
                    - $ref: "#/components/schemas/CustomerTicketSummary"
                message:
                  anyOf:
                    - $ref: "#/components/schemas/Message"
                    - $ref: "#/components/schemas/CustomerMessage"
                changes:
                  type: object
                  properties: {}
                  additionalProperties: true
                notification:
                  $ref: "#/components/schemas/Notification"
                  description: "`notification.created` on `me` (with `ticket_ref` and `project` of ticket notifications)"
                unread_count:
                  type: integer
                  minimum: 0
                  description: "`notification.created` / `notification.read` on `me`: the recipient's unread count after the change"
                browser:
                  type: boolean
                  description: "`notification.created`: the recipient enabled the browser channel for this type"
                ids:
                  type: array
                  items:
                    $ref: "#/components/schemas/Id"
                  description: "`notification.read`: notifications marked read or deleted"
                all:
                  type: boolean
                  description: "`notification.read`: every notification was marked read"
              additionalProperties: true
          required:
            - type
            - topic
            - event
            - at
        - type: object
          properties:
            type:
              const: counts
            data:
              $ref: "#/components/schemas/TicketCounts"
          required:
            - type
            - data
        - type: object
          properties:
            type:
              const: resync
            reason:
              type: string
              enum:
                - gap_too_large
                - slow_consumer
                - permissions_changed
          required:
            - type
            - reason
        - type: object
          properties:
            type:
              const: pong
            id:
