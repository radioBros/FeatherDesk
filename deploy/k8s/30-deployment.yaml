# SPDX-License-Identifier: AGPL-3.0-only
# ONE replica, strategy Recreate: the queue, WebSocket hub and write-behind are
# in-process and the SQLite file has a single writer, so two pods must never
# run at once, not even during a rollout.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: featherdesk
  namespace: featherdesk
  labels:
    app.kubernetes.io/name: featherdesk
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: featherdesk
  template:
    metadata:
      labels:
        app.kubernetes.io/name: featherdesk
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: featherdesk
          image: ghcr.io/radiobros/featherdesk:latest
          imagePullPolicy: IfNotPresent
          args: ["serve"]
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          envFrom:
            - configMapRef:
                name: featherdesk
            - secretRef:
                name: featherdesk
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          # Sized to CONVENTIONS §10: idle ≤ 50 MiB, load ≤ 120 MiB. GOMEMLIMIT is
          # derived from the 256 Mi limit at boot (192 MiB).
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: "1"
              memory: 256Mi
          startupProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 1
            failureThreshold: 60
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 30
            timeoutSeconds: 3
            failureThreshold: 3
          volumeMounts:
            - name: data
              mountPath: /data
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: featherdesk-data
        - name: tmp
          emptyDir:
            medium: Memory
            sizeLimit: 64Mi
