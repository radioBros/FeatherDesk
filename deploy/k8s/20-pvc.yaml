# /data: SQLite database, local attachments, backups, instance lock.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: featherdesk-data
  namespace: featherdesk
  labels:
    app.kubernetes.io/name: featherdesk
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 5Gi
