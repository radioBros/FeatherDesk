#
# nginx in front of FeatherDesk (DEP-015). Unlike Caddy and Traefik, nginx
# needs explicit WebSocket upgrade headers and a read timeout above the app's
# 60 s WebSocket ping interval. Put the map in the http {} context.
#
# In .env: FD_PUBLIC_URL=https://help.example.com,
#          FD_TRUSTED_PROXIES=127.0.0.1/32 (nginx on the host) or its container subnet.

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    listen [::]:80;
    server_name help.example.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name help.example.com;

    ssl_certificate     /etc/letsencrypt/live/help.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/help.example.com/privkey.pem;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Attachments: the app enforces FD_MAX_UPLOAD_MB; let nginx pass them through.
    client_max_body_size 30m;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;

        # WebSocket (/api/v1/ws, subprotocol featherdesk.v1)
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 75s;
        proxy_send_timeout 75s;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;

        # Stream uploads and server responses instead of spooling to disk.
        proxy_request_buffering off;
        proxy_buffering off;
    }
}
