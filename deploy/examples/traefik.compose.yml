#
# Traefik v3 labels for FeatherDesk (DEP-015). Merge with the prod compose:
#   docker compose -f deploy/compose.yml -f deploy/examples/traefik.compose.yml up -d
# It assumes an existing Traefik attached to the external network `proxy`, with
# an entrypoint `websecure` and a certresolver `le`. Traefik forwards WebSocket
# upgrades natively and sets X-Forwarded-*.
#
# In .env: FD_PUBLIC_URL=https://help.example.com and FD_TRUSTED_PROXIES set to
# the `proxy` network's subnet (docker network inspect proxy).
services:
  app:
    ports: !reset []
    networks: [proxy]
    labels:
      traefik.enable: "true"
      traefik.docker.network: proxy
      traefik.http.routers.featherdesk.rule: Host(`help.example.com`)
      traefik.http.routers.featherdesk.entrypoints: websecure
      traefik.http.routers.featherdesk.tls.certresolver: le
      traefik.http.routers.featherdesk.middlewares: featherdesk-hsts
      traefik.http.middlewares.featherdesk-hsts.headers.stsSeconds: "31536000"
      traefik.http.middlewares.featherdesk-hsts.headers.stsIncludeSubdomains: "true"
      traefik.http.services.featherdesk.loadbalancer.server.port: "8080"

networks:
  proxy:
    external: true
