# TEST ONLY (NOT-033): the dovecot-noidle service of compose.test.yml loads this
# after featherdesk-test.conf. It hides IDLE so the inbound IMAP source must use
# its fallback poll. IMAP4rev2 includes IDLE (RFC 9051), so it is hidden as well.
imap_capability {
  IDLE = no
  IMAP4rev2 = no
}
