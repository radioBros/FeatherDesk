# TEST ONLY (DEP-031): extra config for dovecot/dovecot 2.4.5 in compose.test.yml.
# The image's static passdb accepts any user name with $USER_PASSWORD, so the
# two test users (support@test.local, staff@test.local) need no passwd file.

# Plain IMAP on 31143 for integration tests (no TLS inside the test network).
auth_allow_cleartext = yes

# Plus addressing: support+t-123@test.local is delivered to support@test.local.
recipient_delimiter = +

# IMAP IDLE is on by default; keep the check interval short for fast tests.
imap_idle_notify_interval = 5s
