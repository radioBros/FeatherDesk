{{- include "simpletickets.validate" . -}}
{{- if and .Values.secret.create (not .Values.secret.existingSecret) }}
{{- $name := include "simpletickets.fullname" . }}
{{- $key := index .Values.secret.values "ST_SECRET_KEY" | default "" }}
{{- if not $key }}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $name }}
{{- if and $existing $existing.data (index $existing.data "ST_SECRET_KEY") }}
{{- $key = index $existing.data "ST_SECRET_KEY" | b64dec }}
{{- else }}
{{- $key = randAlphaNum 48 }}
{{- end }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "simpletickets.labels" . | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
type: Opaque
stringData:
  ST_SECRET_KEY: {{ $key | quote }}
  {{- range $k, $v := .Values.secret.values }}
  {{- if ne $k "ST_SECRET_KEY" }}
  {{ $k }}: {{ $v | toString | quote }}
  {{- end }}
  {{- end }}
{{- end }}
