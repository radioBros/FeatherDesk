# SPDX-License-Identifier: AGPL-3.0-only
# FeatherDesk Helm values (DEP-023). See .env.example for every FD_* variable.

# Must stay 1: the queue, WebSocket hub and write-behind are in-process and the
# instance holds a lock in /data. The chart refuses to render with > 1.
replicaCount: 1

image:
  repository: ghcr.io/radiobros/featherdesk
  # Defaults to the chart appVersion.
  tag: ""
  pullPolicy: IfNotPresent
imagePullSecrets: []

# Plain (non-secret) FD_* variables, rendered into a ConfigMap.
env:
  FD_PUBLIC_URL: https://help.example.com
  FD_LOG_FORMAT: json
  FD_LOG_LEVEL: info
  # Pod network of the ingress controller.
  FD_TRUSTED_PROXIES: 10.0.0.0/8

# Secret holding FD_SECRET_KEY (required) and any other secret FD_* keys
# (FD_OIDC_*_CLIENT_SECRET, FD_SMTP_PASSWORD, FD_IMAP_PASSWORD, FD_METRICS_TOKEN …).
secret:
  # Use an existing Secret (recommended for GitOps). Must contain FD_SECRET_KEY.
  existingSecret: ""
  # Otherwise the chart creates one. When values.FD_SECRET_KEY is empty a random
  # key is generated on install and kept on upgrades (looked up from the cluster).
  create: true
  values: {}
  #  FD_SECRET_KEY: "<openssl rand -base64 32>"
  #  FD_OIDC_STAFF_CLIENT_SECRET: ""

# Optional external Postgres (D-14). Unset = SQLite on the PVC.
database:
  # Secret with a key holding postgres://user:pass@host:5432/db?sslmode=require
  existingSecret: ""
  key: FD_DATABASE_URL

# Optional S3-compatible attachment storage (D-17). Unset = files on the PVC.
blob:
  # s3://bucket/prefix?endpoint=https://…&region=…&path_style=true
  url: ""
  # Secret with FD_S3_ACCESS_KEY and FD_S3_SECRET_KEY.
  existingSecret: ""

# Optional env-defined inbound IMAP mailbox (FD_IMAP_*); the password goes in
# the main secret as FD_IMAP_PASSWORD.
imap: {}
#  FD_IMAP_HOST: imap.example.com
#  FD_IMAP_PORT: "993"
#  FD_IMAP_SECURITY: tls
#  FD_IMAP_USERNAME: support@example.com
#  FD_IMAP_ADDRESS: support@example.com

persistence:
  enabled: true
  existingClaim: ""
  storageClass: ""
  accessMode: ReadWriteOnce
  size: 5Gi

service:
  type: ClusterIP
  port: 80

ingress:
  enabled: false
  className: nginx
  annotations:
    # WebSockets: keep connections open past the 60 s ping interval.
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-body-size: 30m
  host: help.example.com
  tls:
    enabled: true
    secretName: featherdesk-tls

# Sized to the CONVENTIONS §10 budgets (idle ≤ 50 MiB, load ≤ 120 MiB).
# GOMEMLIMIT is derived from the memory limit at boot (75%).
resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    cpu: "1"
    memory: 256Mi

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 65532
  runAsGroup: 65532
  fsGroup: 65532
  fsGroupChangePolicy: OnRootMismatch
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop: [ALL]

podAnnotations: {}
podLabels: {}
nodeSelector: {}
tolerations: []
affinity: {}
