# yaml-language-server: $schema=https://goauthentik.io/blueprints/schema.json
# SPDX-License-Identifier: AGPL-3.0-only
#
# SimpleTickets on Authentik 2026.8.4 (AUTH-022 / DEP-005). Keys verified
# against blueprints/schema.json and blueprints/testing/oidc-conformance.yaml
# at tag version/2026.8.4 (2026-10-21).
#
# Creates:
#   - groups st-admins, st-supervisors, st-agents, st-l2, st-l3
#   - two confidential OAuth2/OIDC providers (authorization-code grant, S256
#     PKCE accepted by default, scopes openid email profile, claims in the ID
#     token, back-channel logout)
#   - applications simpletickets-staff (only members of st-admins,
#     st-supervisors or st-agents) and simpletickets-customer (any user)
#
# Everything environment-specific comes from the Authentik server/worker env
# (!Env), so the same file works for dev and production:
#   ST_PUBLIC_URL                          e.g. https://help.example.com
#   ST_OIDC_STAFF_CLIENT_ID / _SECRET      choose random values, set the same in SimpleTickets
#   ST_OIDC_CUSTOMER_CLIENT_ID / _SECRET
#
# Map the groups in SimpleTickets with:
#   ST_OIDC_STAFF_ROLE_MAP=st-admins=admin,st-supervisors=supervisor,st-agents=agent
#   ST_OIDC_STAFF_TIER_MAP=st-l2=2,st-l3=3
# Issuer URLs: <authentik>/application/o/simpletickets-staff/ and …/simpletickets-customer/
#
# Dev-only seeded users live in simpletickets-dev-users.blueprint.yaml, which
# only deploy/compose.dev.yml mounts. Never import that one in production.
version: 1
metadata:
  name: SimpleTickets
  labels:
    blueprints.goauthentik.io/description: "SimpleTickets staff + customer OIDC applications and st-* groups"
entries:
  # ---------------------------------------------------------------- groups --
  - model: authentik_core.group
    id: st-admins
    identifiers:
      name: st-admins
    attrs:
      attributes:
        simpletickets_role: admin
  - model: authentik_core.group
    id: st-supervisors
    identifiers:
      name: st-supervisors
    attrs:
      attributes:
        simpletickets_role: supervisor
  - model: authentik_core.group
    id: st-agents
    identifiers:
      name: st-agents
    attrs:
      attributes:
        simpletickets_role: agent
  - model: authentik_core.group
    id: st-l2
    identifiers:
      name: st-l2
    attrs:
      attributes:
        simpletickets_tier: 2
  - model: authentik_core.group
    id: st-l3
    identifiers:
      name: st-l3
    attrs:
      attributes:
        simpletickets_tier: 3

  # ------------------------------------------------------- staff provider --
  - model: authentik_providers_oauth2.oauth2provider
    id: provider-staff
    identifiers:
      name: simpletickets-staff
    attrs:
      authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
      invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
      client_type: confidential
      # Authentik 2026.x allows only the listed grants; empty = none (authorize
      # answers "invalid_request"). SimpleTickets uses the code flow (+ PKCE).
      grant_types: [authorization_code, refresh_token]
      client_id: !Env [ST_OIDC_STAFF_CLIENT_ID, simpletickets-staff]
      client_secret: !Env ST_OIDC_STAFF_CLIENT_SECRET
      issuer_mode: per_provider
      sub_mode: hashed_user_id
      include_claims_in_id_token: true
      access_code_validity: minutes=1
      access_token_validity: minutes=5
      redirect_uris:
        - matching_mode: strict
          redirect_uri_type: authorization
          url: !Format ["%s/api/v1/auth/oidc/staff/callback", !Env [ST_PUBLIC_URL, "http://localhost:8080"]]
        - matching_mode: regex
          redirect_uri_type: logout
          url: !Format ["^%s/.*$", !Env [ST_PUBLIC_URL, "http://localhost:8080"]]
      logout_method: backchannel
      logout_uri: !Format ["%s/api/v1/auth/oidc/staff/backchannel-logout", !Env [ST_PUBLIC_URL, "http://localhost:8080"]]
      property_mappings:
        - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-openid]]
        - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-email]]
        - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-profile]]
      signing_key: !Find [authentik_crypto.certificatekeypair, [name, authentik Self-signed Certificate]]

  - model: authentik_core.application
    id: app-staff
    identifiers:
      slug: simpletickets-staff
    attrs:
      name: SimpleTickets (staff)
      provider: !KeyOf provider-staff
      policy_engine_mode: any
      meta_launch_url: !Format ["%s/agent", !Env [ST_PUBLIC_URL, "http://localhost:8080"]]
      meta_description: Help desk agent panel

  # Only st-* staff may use the staff application (policy engine mode: any).
  - model: authentik_policies.policybinding
    identifiers:
      target: !KeyOf app-staff
      group: !KeyOf st-admins
    attrs:
      order: 10
  - model: authentik_policies.policybinding
    identifiers:
      target: !KeyOf app-staff
      group: !KeyOf st-supervisors
    attrs:
      order: 20
  - model: authentik_policies.policybinding
    identifiers:
      target: !KeyOf app-staff
      group: !KeyOf st-agents
    attrs:
      order: 30

  # ---------------------------------------------------- customer provider --
  - model: authentik_providers_oauth2.oauth2provider
    id: provider-customer
    identifiers:
      name: simpletickets-customer
    attrs:
      authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
      invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
      client_type: confidential
      grant_types: [authorization_code, refresh_token]
      client_id: !Env [ST_OIDC_CUSTOMER_CLIENT_ID, simpletickets-customer]
      client_secret: !Env ST_OIDC_CUSTOMER_CLIENT_SECRET
      issuer_mode: per_provider
      sub_mode: hashed_user_id
      include_claims_in_id_token: true
      access_code_validity: minutes=1
      access_token_validity: minutes=5
      redirect_uris:
        - matching_mode: strict
          redirect_uri_type: authorization
          url: !Format ["%s/api/v1/auth/oidc/customer/callback", !Env [ST_PUBLIC_URL, "http://localhost:8080"]]
        - matching_mode: regex
          redirect_uri_type: logout
          url: !Format ["^%s/.*$", !Env [ST_PUBLIC_URL, "http://localhost:8080"]]
      logout_method: backchannel
      logout_uri: !Format ["%s/api/v1/auth/oidc/customer/backchannel-logout", !Env [ST_PUBLIC_URL, "http://localhost:8080"]]
      property_mappings:
        - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-openid]]
        - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-email]]
        - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-profile]]
      signing_key: !Find [authentik_crypto.certificatekeypair, [name, authentik Self-signed Certificate]]

  - model: authentik_core.application
    id: app-customer
    identifiers:
      slug: simpletickets-customer
    attrs:
      name: SimpleTickets (customer portal)
      provider: !KeyOf provider-customer
      policy_engine_mode: any
      meta_launch_url: !Env [ST_PUBLIC_URL, "http://localhost:8080"]
      meta_description: Help desk customer portal
