# yaml-language-server: $schema=https://goauthentik.io/blueprints/schema.json
# SPDX-License-Identifier: AGPL-3.0-only
#
# DEV ONLY (DEP-005): seeded users with a fixed, published password. Mounted
# by deploy/compose.dev.yml only. NEVER import this into a real Authentik.
#
#   user             groups                    → FeatherDesk
#   fd-admin         fd-admins, fd-l3          admin, tier 3
#   fd-supervisor    fd-supervisors, fd-l3     supervisor, tier 3
#   fd-agent-l1      fd-agents                 agent, tier 1
#   fd-agent-l2      fd-agents, fd-l2          agent, tier 2
#   fd-agent-l3      fd-agents, fd-l3          agent, tier 3
#   fd-customer      (none)                    customer (portal SSO only)
#
# Password for all of them: FD_DEV_IDP_PASSWORD (default below).
version: 1
metadata:
  name: FeatherDesk dev users
  labels:
    blueprints.goauthentik.io/description: "DEV ONLY: seeded FeatherDesk users"
entries:
  # Apply the main blueprint first so the fd-* groups exist.
  - model: authentik_blueprints.metaapplyblueprint
    attrs:
      identifiers:
        name: FeatherDesk
      required: true

  - model: authentik_core.user
    identifiers:
      username: fd-admin
    attrs:
      name: Dev Admin
      email: fd-admin@dev.test
      type: internal
      is_active: true
      password: !Env [FD_DEV_IDP_PASSWORD, "dev-Password-123!"]
      groups:
        - !Find [authentik_core.group, [name, fd-admins]]
        - !Find [authentik_core.group, [name, fd-l3]]
  - model: authentik_core.user
    identifiers:
      username: fd-supervisor
    attrs:
      name: Dev Supervisor
      email: fd-supervisor@dev.test
      type: internal
      is_active: true
      password: !Env [FD_DEV_IDP_PASSWORD, "dev-Password-123!"]
      groups:
        - !Find [authentik_core.group, [name, fd-supervisors]]
        - !Find [authentik_core.group, [name, fd-l3]]
  - model: authentik_core.user
    identifiers:
      username: fd-agent-l1
    attrs:
      name: Dev Agent L1
      email: fd-agent-l1@dev.test
      type: internal
      is_active: true
      password: !Env [FD_DEV_IDP_PASSWORD, "dev-Password-123!"]
      groups:
        - !Find [authentik_core.group, [name, fd-agents]]
  - model: authentik_core.user
    identifiers:
      username: fd-agent-l2
    attrs:
      name: Dev Agent L2
      email: fd-agent-l2@dev.test
      type: internal
      is_active: true
      password: !Env [FD_DEV_IDP_PASSWORD, "dev-Password-123!"]
      groups:
        - !Find [authentik_core.group, [name, fd-agents]]
        - !Find [authentik_core.group, [name, fd-l2]]
  - model: authentik_core.user
    identifiers:
      username: fd-agent-l3
    attrs:
      name: Dev Agent L3
      email: fd-agent-l3@dev.test
      type: internal
      is_active: true
      password: !Env [FD_DEV_IDP_PASSWORD, "dev-Password-123!"]
      groups:
        - !Find [authentik_core.group, [name, fd-agents]]
        - !Find [authentik_core.group, [name, fd-l3]]
  - model: authentik_core.user
    identifiers:
      username: fd-customer
    attrs:
      name: Dev Customer
      email: fd-customer@dev.test
      type: external
      is_active: true
      password: !Env [FD_DEV_IDP_PASSWORD, "dev-Password-123!"]

  # Back-channel logout (AUTH-030): Authentik's worker POSTs the logout token
  # server-to-server. In the dev stack FD_PUBLIC_URL (http://localhost:8080) is
  # the browser's address and unreachable from the worker container, so point
  # the providers at the app's compose service name instead. In production the
  # main blueprint's default (FD_PUBLIC_URL + path) is correct.
  - model: authentik_providers_oauth2.oauth2provider
    identifiers:
      name: featherdesk-staff
    attrs:
      logout_method: backchannel
      logout_uri: http://app:8080/api/v1/auth/oidc/staff/backchannel-logout
  - model: authentik_providers_oauth2.oauth2provider
    identifiers:
      name: featherdesk-customer
    attrs:
      logout_method: backchannel
      logout_uri: http://app:8080/api/v1/auth/oidc/customer/backchannel-logout
